{% extends "base.html" %}

{% block title %}Öğrenci Yönetimi{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h3 class="mb-0"><i class="bi bi-people"></i> Öğrenci Listesi</h3>
    <div class="d-flex gap-2">
        <button class="btn btn-danger btn-sm" id="deleteAllStudentsBtn">
            <i class="bi bi-trash3"></i> Tümünü Sil
        </button>
        <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#studentModal" onclick="openAddStudentModal()">
            <i class="bi bi-plus-lg"></i> Yeni Öğrenci
        </button>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="studentsTable">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Ad Soyad</th>
                        <th>Numara</th>
                        <th>Sınıf</th>
                        <th>Düzey</th>
                        <th>Cinsiyet</th>
                        <th class="text-end">İşlemler</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Öğrenci Modal -->
<div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Öğrenci Bilgileri</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="studentId">
                <div class="mb-3">
                    <label class="form-label">Ad Soyad</label>
                    <input type="text" id="studentAdSoyad" class="form-control" placeholder="Örn: Ahmet Yılmaz">
                </div>
                <div class="mb-3">
                    <label class="form-label">Numara</label>
                    <input type="text" id="studentNumara" class="form-control" placeholder="Örn: 901">
                </div>
                <div class="mb-3">
                    <label class="form-label">Sınıf</label>
                    <input type="text" id="studentSinif" class="form-control" placeholder="Örn: 9A">
                </div>
                <div class="mb-3">
                    <label class="form-label">Düzey</label>
                    <input type="number" id="studentDuzey" class="form-control" placeholder="Örn: 9">
                </div>
                <div class="mb-3">
                    <label class="form-label">Cinsiyet</label>
                    <select id="studentCinsiyet" class="form-select">
                        <option>Erkek</option>
                        <option>Kız</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
                <button type="button" class="btn btn-primary" id="saveStudentBtn">Kaydet</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const API_STUDENTS = '/api/students';
    let students = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadStudents();
        document.getElementById('saveStudentBtn').addEventListener('click', saveStudent);
        document.getElementById('deleteAllStudentsBtn').addEventListener('click', deleteAllStudents);
    });

    async function loadStudents() {
        try {
            const res = await fetch(API_STUDENTS);
            students = await res.json();
            renderStudents();
        } catch (e) {
            showToast('Öğrenciler yüklenemedi!', 'danger');
        }
    }

    function renderStudents() {
        const tbody = document.querySelector('#studentsTable tbody');
        if (!students.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Henüz öğrenci yok</td></tr>';
            return;
        }
        tbody.innerHTML = students.map(s => `
            <tr>
                <td>${s.id}</td>
                <td><strong>${s.ad_soyad}</strong></td>
                <td>${s.numara || '-'}</td>
                <td>${s.sinif || '-'}</td>
                <td>${s.duzey || '-'}</td>
                <td>${s.cinsiyet || '-'}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editStudent(${s.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${s.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function openAddStudentModal() {
        document.getElementById('studentId').value = '';
        document.getElementById('studentAdSoyad').value = '';
        document.getElementById('studentNumara').value = '';
        document.getElementById('studentSinif').value = '';
        document.getElementById('studentDuzey').value = '';
        document.getElementById('studentCinsiyet').value = 'Erkek';
        document.querySelector('#studentModal .modal-title').textContent = 'Yeni Öğrenci';
    }

    function editStudent(id) {
        const s = students.find(x => x.id === id);
        if (!s) return;
        document.getElementById('studentId').value = s.id;
        document.getElementById('studentAdSoyad').value = s.ad_soyad;
        document.getElementById('studentNumara').value = s.numara || '';
        document.getElementById('studentSinif').value = s.sinif || '';
        document.getElementById('studentDuzey').value = s.duzey || '';
        document.getElementById('studentCinsiyet').value = s.cinsiyet || 'Erkek';
        document.querySelector('#studentModal .modal-title').textContent = 'Öğrenci Düzenle';
        new bootstrap.Modal(document.getElementById('studentModal')).show();
    }

    async function saveStudent() {
        const id = document.getElementById('studentId').value;
        const data = {
            ad_soyad: document.getElementById('studentAdSoyad').value.trim(),
            numara: document.getElementById('studentNumara').value.trim(),
            sinif: document.getElementById('studentSinif').value.trim(),
            duzey: document.getElementById('studentDuzey').value,
            cinsiyet: document.getElementById('studentCinsiyet').value
        };
        if (!data.ad_soyad) {
            showToast('Ad Soyad zorunludur!', 'warning');
            return;
        }
        try {
            const url = id ? `${API_STUDENTS}/${id}` : API_STUDENTS;
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error();
            showToast(id ? 'Öğrenci güncellendi' : 'Öğrenci eklendi');
            bootstrap.Modal.getInstance(document.getElementById('studentModal')).hide();
            loadStudents();
        } catch (e) {
            showToast('Kaydetme başarısız!', 'danger');
        }
    }

    async function deleteStudent(id) {
        if (!confirm('Bu öğrenciyi silmek istediğinize emin misiniz?')) return;
        try {
            await fetch(`${API_STUDENTS}/${id}`, { method: 'DELETE' });
            showToast('Öğrenci silindi');
            loadStudents();
        } catch (e) {
            showToast('Silme başarısız!', 'danger');
        }
    }

    async function deleteAllStudents() {
        if (!confirm('TÜM öğrencileri silmek istediğinize emin misiniz? Bu işlem geri alınamaz!')) return;
        try {
            await fetch(API_STUDENTS, { method: 'DELETE' });
            showToast('Tüm öğrenciler silindi');
            loadStudents();
        } catch (e) {
            showToast('Silme başarısız!', 'danger');
        }
    }
</script>
{% endblock %}
